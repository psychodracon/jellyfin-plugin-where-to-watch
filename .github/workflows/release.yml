name: Release

# Push a tag such as 1.0.1.0 (or v1.0.1.0) to publish a release. The tag is the plugin version.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Work out the version
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Jellyfin versions have four parts; 1.2.3 becomes 1.2.3.0.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="$version.0"; fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version like 1.2.3 or 1.2.3.4"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test WhereToWatch.slnx -c Release

      - name: Publish
        run: >
          dotnet publish Jellyfin.Plugin.WhereToWatch -c Release -o publish
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pack
        run: |
          mkdir -p dist
          zip="dist/where-to-watch_${{ steps.ver.outputs.version }}.zip"
          zip -j "$zip" publish/Jellyfin.Plugin.WhereToWatch.dll
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.zip }}" \
            --title "Where to Watch ${{ steps.ver.outputs.version }}" \
            --generate-notes --verify-tag

      # The tag points at the release commit, so the manifest change goes on the default branch.
      - name: Update manifest.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          ZIP: ${{ steps.pack.outputs.zip }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHANGELOG: See the release notes at https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          node scripts/update-manifest.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "chore(release): add ${VERSION} to manifest"
          git push origin "$DEFAULT_BRANCH"
